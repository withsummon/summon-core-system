x-app-environment: &app-environment
  WEB_URL: ${WEB_URL:-https://core.withsummon.com}
  DEBUG: "0"
  CORS_ALLOWED_ORIGINS: ${WEB_URL:-https://core.withsummon.com}
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
  USE_MINIO: "1"
  POSTGRES_USER: ${POSTGRES_USER:-plane}
  POSTGRES_DB: ${POSTGRES_DB:-plane}
  POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
  SECRET_KEY_FILE: /run/secrets/django_secret_key
  SUMMON_CREDENTIAL_KEY_FILE: /run/secrets/summon_credential_key
  REDIS_URL: redis://plane-redis:6379/
  RABBITMQ_USER: ${RABBITMQ_USER:-plane}
  RABBITMQ_VHOST: ${RABBITMQ_VHOST:-plane}
  RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password
  AWS_REGION: ${AWS_REGION:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-summon-core}
  AWS_SECRET_ACCESS_KEY_FILE: /run/secrets/minio_password
  AWS_S3_ENDPOINT_URL: http://plane-minio:9000
  AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
  MINIO_ENDPOINT_SSL: "0"
  API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}
  LIVE_SERVER_SECRET_KEY_FILE: /run/secrets/live_server_secret_key
  LIVE_BASE_URL: http://live:3000
  CODEX_BRIDGE_URL: http://codex-bridge:8090
  TRANSCRIPTION_URL: http://transcription:8091/transcribe
  SUMMON_RECORDING_FILE_SIZE_LIMIT: "262144000"
  LLM_PROVIDER: codex
  LLM_MODEL: ${LLM_MODEL:-default}
  LLM_REQUEST_TIMEOUT_SECONDS: "120"
  WEBHOOK_ALLOWED_IPS: ${WEBHOOK_ALLOWED_IPS:-}
  WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}
  SUMMON_MCP_URL: http://mcp:8211/mcp/http/api-key/mcp
  SUMMON_AI_INTERNAL_TOKEN_FILE: /run/secrets/summon_ai_internal_token

x-api-service: &api-service
  image: withsummon-summon-core-system-api:latest
  build:
    context: ../../apps/api
    dockerfile: Dockerfile.api
  restart: unless-stopped
  entrypoint: ["./bin/docker-entrypoint-secrets.sh"]
  environment: *app-environment
  secrets:
    - django_secret_key
    - summon_credential_key
    - postgres_password
    - rabbitmq_password
    - minio_password
    - live_server_secret_key
    - summon_ai_internal_token
  # codex-bridge and transcription are called per request, not at boot. Depending on them made every deploy stop
  # the api until both rebuilt images turned healthy.
  depends_on:
    plane-db:
      condition: service_healthy
    plane-redis:
      condition: service_healthy
    plane-mq:
      condition: service_healthy

services:
  web:
    image: withsummon-summon-core-system-web:latest
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile.web
    restart: unless-stopped
    # Static files only: nothing here needs the api to boot, so a deploy restarts it in seconds instead of
    # holding it behind the api's restart.
    networks:
      default:
        aliases: [summon-core-web]

  admin:
    image: makeplane/plane-admin:${PLANE_RELEASE:-stable}
    restart: unless-stopped
    # Static files only: nothing here needs the api to boot, so a deploy restarts it in seconds instead of
    # holding it behind the api's restart.
    networks:
      default:
        aliases: [summon-core-admin]

  space:
    image: makeplane/plane-space:${PLANE_RELEASE:-stable}
    restart: unless-stopped
    # Static files only: nothing here needs the api to boot, so a deploy restarts it in seconds instead of
    # holding it behind the api's restart.
    networks:
      default:
        aliases: [summon-core-space]

  live:
    image: makeplane/plane-live:${PLANE_RELEASE:-stable}
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -ec
      - |
        export LIVE_SERVER_SECRET_KEY="$$(cat /run/secrets/live_server_secret_key)"
        exec docker-entrypoint.sh node apps/live
    environment:
      API_BASE_URL: http://${API_INTERNAL_HOST:-summon-core-api}:8000
      REDIS_URL: redis://plane-redis:6379/
    secrets:
      - live_server_secret_key
    networks:
      default:
        aliases: [summon-core-live]
      summon-core-internal: {}
    depends_on:
      api:
        condition: service_started
      plane-redis:
        condition: service_healthy

  api:
    <<: *api-service
    command: ./bin/docker-entrypoint-api.sh
    # Ready only once gunicorn answers: the entrypoint first waits for migrations and runs its startup commands.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 300s
    volumes:
      - logs_api:/code/plane/logs
    networks:
      default:
        aliases: [summon-core-api]

  worker:
    <<: *api-service
    command: ./bin/docker-entrypoint-worker.sh
    volumes:
      - logs_worker:/code/plane/logs
    depends_on:
      api:
        condition: service_started

  beat-worker:
    <<: *api-service
    command: ./bin/docker-entrypoint-beat.sh
    volumes:
      - logs_beat:/code/plane/logs
    depends_on:
      api:
        condition: service_started

  migrator:
    <<: *api-service
    command: ./bin/docker-entrypoint-migrator.sh
    restart: "no"
    volumes:
      - logs_migrator:/code/plane/logs

  plane-db:
    image: postgres:15.7-alpine
    restart: unless-stopped
    command: postgres -c max_connections=1000
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plane}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-plane}
    secrets:
      - postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plane} -d ${POSTGRES_DB:-plane}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      default: {}
      summon-core-internal: {}

  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      default: {}
      summon-core-internal: {}

  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -ec
      - |
        export RABBITMQ_DEFAULT_PASS="$$(cat /run/secrets/rabbitmq_password)"
        exec docker-entrypoint.sh rabbitmq-server
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-plane}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-plane}
    secrets:
      - rabbitmq_password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      default: {}
      summon-core-internal: {}

  plane-minio:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mkdir -p /export/${AWS_S3_BUCKET_NAME:-uploads}
        exec silo server /export --console-address :9090
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-summon-core}
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_password
    secrets:
      - minio_password
    volumes:
      - uploads:/export
    networks:
      default:
        aliases: [summon-core-minio]
      summon-core-internal: {}

  mcp:
    image: makeplane/plane-mcp-server:v0.3.1
    restart: unless-stopped
    environment:
      PLANE_INTERNAL_BASE_URL: http://${API_INTERNAL_HOST:-summon-core-api}:8000
      PLANE_OAUTH_PROVIDER_CLIENT_ID: summon-core-mcp
      PLANE_OAUTH_PROVIDER_CLIENT_SECRET: ${PLANE_OAUTH_PROVIDER_CLIENT_SECRET:-pat-route-only}
      PLANE_OAUTH_PROVIDER_BASE_URL: ${WEB_URL:-https://core.withsummon.com}
      REDIS_HOST: plane-redis
      REDIS_PORT: "6379"
      MCP_PATH_PREFIX: /mcp
      LOG_PAYLOADS: "false"
      LOG_USER_INFO: "false"
    depends_on:
      api:
        condition: service_started
      plane-redis:
        condition: service_healthy
    networks:
      default:
        aliases: [summon-core-mcp]
      summon-core-internal: {}

  ai:
    build:
      context: ../..
      dockerfile: apps/ai/Dockerfile
      # The build stamps the deployed commit from the clone's .git (outside the main context's .dockerignore).
      additional_contexts:
        git: ../../.git
    image: withsummon-summon-core-system-ai:latest
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -ec
      - |
        export SUMMON_AI_INTERNAL_TOKEN="$$(cat /run/secrets/summon_ai_internal_token)"
        export APP_VERSION="$$(cat VERSION)"
        exec bun dist/main.js
    environment:
      DJANGO_URL: http://${API_INTERNAL_HOST:-summon-core-api}:8000
      WEB_URL: ${WEB_URL:-https://core.withsummon.com}
      PLANE_MCP_URL: http://mcp:8211/mcp/http/api-key/mcp
    secrets:
      - summon_ai_internal_token
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3300/ai/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      api:
        condition: service_started
      mcp:
        condition: service_started
    networks:
      default:
        aliases: [summon-core-ai]
      summon-core-internal: {}

  codex-bridge:
    build:
      context: ../../apps/codex-bridge
      dockerfile: Dockerfile
    image: withsummon-summon-core-system-codex-bridge:latest
    restart: unless-stopped
    environment:
      CODEX_TIMEOUT_MS: "110000"
    volumes:
      - codex_auth:/home/node/.codex
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      default: {}
      summon-core-internal: {}

  transcription:
    build:
      context: ../../apps/transcription
      dockerfile: Dockerfile
    image: withsummon-summon-core-system-transcription:latest
    restart: unless-stopped
    environment:
      TRANSCRIPTION_MAX_BYTES: "262144000"
      WHISPER_MODEL: small
      WHISPER_COMPUTE_TYPE: int8
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      default: {}
      summon-core-internal: {}

  proxy:
    image: makeplane/plane-proxy:${PLANE_RELEASE:-stable}
    restart: unless-stopped
    expose:
      - "80"
    environment:
      # Compose does not notice edits inside the mounted Caddyfile; bump this with every Caddyfile change so the
      # next deploy recreates the proxy and loads it.
      CADDYFILE_REVISION: "2"
      SITE_ADDRESS: :80
      FILE_SIZE_LIMIT: ${SUMMON_RECORDING_FILE_SIZE_LIMIT:-262144000}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      TRUSTED_PROXIES: 0.0.0.0/0
      WEB_HOST: summon-core-web
      API_HOST: ${API_INTERNAL_HOST:-summon-core-api}
      ADMIN_HOST: summon-core-admin
      SPACE_HOST: summon-core-space
      LIVE_HOST: summon-core-live
      MINIO_HOST: summon-core-minio
      MCP_HOST: summon-core-mcp
      AI_HOST: summon-core-ai
    volumes:
      - ../../apps/proxy/Caddyfile.ce:/etc/caddy/Caddyfile:ro
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_started
      admin:
        condition: service_started
      space:
        condition: service_started
      live:
        condition: service_started
      mcp:
        condition: service_started
      ai:
        condition: service_started

  # Carries Cloudflare's traffic for core.withsummon.com to the proxy over connections this host opens. Cloudflare
  # dialing in to the host's public IP stalls: the provider's network drops many SYN-ACKs back to Cloudflare, so
  # requests waited 15-50 s or failed with 522 while the host itself answered in milliseconds. The tunnel's routes
  # live in Cloudflare (remotely managed) and point at http://proxy:80; this service is only on the project's
  # default network, where `proxy` can only mean this project's Caddy.
  # cloudflared runs as uid 65532 and Compose bind-mounts secret files as they are on the host, so the token file
  # must be owned by 65532 (mode 600): `chown 65532:65532 /etc/dokploy-secrets/summon-core-plane/cloudflare_tunnel_token`.
  cloudflared:
    image: cloudflare/cloudflared:2025.8.1
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run", "--token-file", "/run/secrets/cloudflare_tunnel_token"]
    secrets:
      - cloudflare_tunnel_token
    depends_on:
      proxy:
        condition: service_started

networks:
  # A private network that a Swarm service can also join (it is an attachable overlay; the Dokploy host is a Swarm
  # manager), so the api can move to a start-first Swarm service and still reach these services by name. Only the
  # api's dependencies and its callers join it. The shared dokploy-network would expose names like plane-db to every
  # other project on the host.
  summon-core-internal:
    name: summon-core-internal
    driver: overlay
    attachable: true

volumes:
  pgdata:
  redisdata:
  rabbitmq_data:
  uploads:
  logs_api:
  logs_worker:
  logs_beat:
  logs_migrator:
  codex_auth:

secrets:
  django_secret_key:
    file: /etc/dokploy-secrets/summon-core-plane/django_secret_key
  summon_credential_key:
    file: /etc/dokploy-secrets/summon-core-plane/summon_credential_key
  postgres_password:
    file: /etc/dokploy-secrets/summon-core-plane/postgres_password
  rabbitmq_password:
    file: /etc/dokploy-secrets/summon-core-plane/rabbitmq_password
  minio_password:
    file: /etc/dokploy-secrets/summon-core-plane/minio_password
  live_server_secret_key:
    file: /etc/dokploy-secrets/summon-core-plane/live_server_secret_key
  summon_ai_internal_token:
    file: /etc/dokploy-secrets/summon-core-plane/summon_ai_internal_token
  cloudflare_tunnel_token:
    file: /etc/dokploy-secrets/summon-core-plane/cloudflare_tunnel_token
