x-app-environment: &app-environment
  WEB_URL: ${WEB_URL}
  DEBUG: "0"
  CORS_ALLOWED_ORIGINS: ${WEB_URL}
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
  USE_MINIO: "1"
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@plane-db:5432/${POSTGRES_DB}
  SECRET_KEY: ${SECRET_KEY}
  SUMMON_CREDENTIAL_KEY: ${SUMMON_CREDENTIAL_KEY}
  REDIS_URL: redis://plane-redis:6379/
  AMQP_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@plane-mq:5672/${RABBITMQ_VHOST}
  AWS_REGION: ${AWS_REGION:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  AWS_S3_ENDPOINT_URL: http://plane-minio:9000
  AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
  MINIO_ENDPOINT_SSL: "0"
  API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY}
  WEBHOOK_ALLOWED_IPS: ${WEBHOOK_ALLOWED_IPS:-}
  WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}

x-api-service: &api-service
  image: summon-core-api:${SUMMON_IMAGE_TAG:-latest}
  build:
    context: ../../apps/api
    dockerfile: Dockerfile.api
  restart: unless-stopped
  environment: *app-environment
  depends_on:
    plane-db:
      condition: service_healthy
    plane-redis:
      condition: service_healthy
    plane-mq:
      condition: service_healthy

services:
  web:
    image: summon-core-web:${SUMMON_IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started

  admin:
    image: makeplane/plane-admin:${PLANE_RELEASE:-stable}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started

  space:
    image: makeplane/plane-space:${PLANE_RELEASE:-stable}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started

  live:
    image: makeplane/plane-live:${PLANE_RELEASE:-stable}
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:8000
      REDIS_URL: redis://plane-redis:6379/
      LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY}
    depends_on:
      api:
        condition: service_started
      plane-redis:
        condition: service_healthy

  api:
    <<: *api-service
    command: ./bin/docker-entrypoint-api.sh
    volumes:
      - logs_api:/code/plane/logs

  worker:
    <<: *api-service
    command: ./bin/docker-entrypoint-worker.sh
    volumes:
      - logs_worker:/code/plane/logs
    depends_on:
      api:
        condition: service_started

  beat-worker:
    <<: *api-service
    command: ./bin/docker-entrypoint-beat.sh
    volumes:
      - logs_beat:/code/plane/logs
    depends_on:
      api:
        condition: service_started

  migrator:
    <<: *api-service
    command: ./bin/docker-entrypoint-migrator.sh
    restart: "no"
    volumes:
      - logs_migrator:/code/plane/logs

  plane-db:
    image: postgres:15.7-alpine
    restart: unless-stopped
    command: postgres -c max_connections=1000
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  plane-minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /export --console-address :9090
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    volumes:
      - uploads:/export

  proxy:
    image: makeplane/plane-proxy:${PLANE_RELEASE:-stable}
    restart: unless-stopped
    expose:
      - "80"
    environment:
      SITE_ADDRESS: :80
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      TRUSTED_PROXIES: 0.0.0.0/0
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_started
      admin:
        condition: service_started
      space:
        condition: service_started
      live:
        condition: service_started

volumes:
  pgdata:
  redisdata:
  rabbitmq_data:
  uploads:
  logs_api:
  logs_worker:
  logs_beat:
  logs_migrator:
