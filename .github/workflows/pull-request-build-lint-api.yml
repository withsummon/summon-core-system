name: Build and lint API

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "main"
    types:
      - "opened"
      - "synchronize"
      - "ready_for_review"
      - "review_requested"
      - "reopened"
    paths:
      - "apps/api/**"
  push:
    branches:
      - "main"
    paths:
      - "apps/api/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-api:
    name: Lint API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/api
    if: |
      github.event_name != 'pull_request' || (
        github.event.pull_request.draft == false &&
        github.event.pull_request.requested_reviewers != null
      )
    steps:
      - uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
      # --locked fails if uv.lock is stale; --only-group lint installs ruff alone.
      - name: Lint
        run: uv run --locked --only-group lint ruff check
      - name: Check formatting
        run: uv run --locked --only-group lint ruff format --check
