services:
  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"

  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}

  plane-minio:
    # RustFS: S3-compatible, serves S3 on :9000 (service name kept for existing refs).
    image: rustfs/rustfs:1.0.0
    restart: unless-stopped
    networks:
      - dev_env
    entrypoint:
      - /bin/sh
      - -c
      - |
        /entrypoint.sh rustfs &
        until curl -sf http://localhost:9000/health >/dev/null; do sleep 1; done
        curl -sf -X PUT --aws-sigv4 aws:amz:us-east-1:s3 --user "$$RUSTFS_ACCESS_KEY:$$RUSTFS_SECRET_KEY" http://localhost:9000/${AWS_S3_BUCKET_NAME} >/dev/null
        wait
    volumes:
      - uploads:/data
    env_file:
      - .env
    environment:
      RUSTFS_ACCESS_KEY: ${AWS_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY}
    healthcheck:
      test: ["CMD-SHELL", "curl -sfI --aws-sigv4 aws:amz:us-east-1:s3 --user \"$$RUSTFS_ACCESS_KEY:$$RUSTFS_SECRET_KEY\" http://localhost:9000/${AWS_S3_BUCKET_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "9000:9000"
      - "9090:9001"

  plane-db:
    image: postgres:15.7-alpine
    restart: unless-stopped
    networks:
      - dev_env
    command: postgres -c 'max_connections=1000'
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - ./apps/api:/code
    command: ./bin/docker-entrypoint-api-local.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - plane-db
      - plane-redis
      - plane-mq
    ports:
      - "8000:8000"

  mcp:
    image: makeplane/plane-mcp-server:v0.3.1
    restart: unless-stopped
    networks:
      - dev_env
    environment:
      PLANE_INTERNAL_BASE_URL: http://api:8000
      PLANE_OAUTH_PROVIDER_CLIENT_ID: summon-core-local
      PLANE_OAUTH_PROVIDER_CLIENT_SECRET: local-pat-route-only
      PLANE_OAUTH_PROVIDER_BASE_URL: http://localhost:8211
      REDIS_HOST: plane-redis
      REDIS_PORT: "6379"
      MCP_PATH_PREFIX: /mcp
      LOG_PAYLOADS: "false"
      LOG_USER_INFO: "false"
    depends_on:
      - api
      - plane-redis
    ports:
      - "8211:8211"

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - ./apps/api:/code
    command: ./bin/docker-entrypoint-worker.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - api
      - plane-db
      - plane-redis

  beat-worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - ./apps/api:/code
    command: ./bin/docker-entrypoint-beat.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - api
      - plane-db
      - plane-redis

  migrator:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: "no"
    networks:
      - dev_env
    volumes:
      - ./apps/api:/code
    command: ./bin/docker-entrypoint-migrator.sh --settings=plane.settings.local
    env_file:
      - ./apps/api/.env
    depends_on:
      - plane-db
      - plane-redis

volumes:
  redisdata:
  uploads:
  pgdata:
  rabbitmq_data:

networks:
  dev_env:
    driver: bridge
