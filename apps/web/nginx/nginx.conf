worker_processes 4;

events {
  worker_connections 1024;
}

http {
  include mime.types;

  default_type  application/octet-stream;

  set_real_ip_from        0.0.0.0/0;
  real_ip_recursive       on;
  real_ip_header          X-Forwarded-For;
  limit_req_zone          $binary_remote_addr zone=mylimit:10m rate=10r/s;

  access_log /dev/stdout;
  error_log /dev/stderr;

  server {
    listen 3000;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-XSS-Protection "1; mode=block" always;

    root /usr/share/nginx/html;

    # Locations below add their own headers; keep the security headers above on them too.
    add_header_inherit merge;

    location / {
      index  index.html index.htm;
      try_files $uri $uri/ /index.html;
      # The SPA shell names the current build's assets, so browsers and Cloudflare must revalidate it.
      add_header Cache-Control "no-cache" always;
    }

    # Well-known URIs are machine-read (OAuth discovery by MCP clients, for one), so a missing one must be a 404,
    # never the SPA shell: a client parsing index.html as JSON fails with a parse error instead of seeing "absent".
    location /.well-known/ {
      try_files $uri =404;
    }

    # Vite puts a content hash in every file name here, so a file never changes once published. Without an
    # explicit header Cloudflare applies its 4 h default and re-fetches each file from this server.
    location /assets/ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
  }
}

